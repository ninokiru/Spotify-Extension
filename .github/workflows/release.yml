name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-x64:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(node -e "console.log(require('./package.json').version)")
            echo "value=${VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck and bundle payload
        run: npm run build

      - name: Vet and test
        shell: bash
        run: |
          go vet ./...
          go test ./...

      - name: Build CLI
        shell: bash
        run: |
          mkdir -p release
          go build -trimpath -ldflags "-s -w -X main.version=${{ steps.version.outputs.value }}" -o release/sxe.exe .

      - name: Assemble zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging/runtime | Out-Null
          Copy-Item release/sxe.exe staging/
          Copy-Item dist/payload/runtime.js staging/runtime/runtime.js
          Copy-Item extensions staging/extensions -Recurse
          Copy-Item themes staging/themes -Recurse
          Copy-Item snippets staging/snippets -Recurse
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path staging/* -DestinationPath release/spotify-extension-windows-x64.zip -Force

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: release/spotify-extension-windows-x64.zip
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Upload zip artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v7
        with:
          name: spotify-extension-windows-x64
          path: release/spotify-extension-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
