name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-x64:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(node -e "console.log(require('./package.json').version)")
            echo "value=${VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Stamp version
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          node -e "
            const fs = require('fs');
            const version = process.env.VERSION;
            const cargoPath = 'src-tauri/Cargo.toml';
            const cargo = fs.readFileSync(cargoPath, 'utf8');
            fs.writeFileSync(cargoPath, cargo.replace(/^version = \".*\"$/m, 'version = \"' + version + '\"'));
            const confPath = 'src-tauri/tauri.conf.json';
            const conf = JSON.parse(fs.readFileSync(confPath, 'utf8'));
            conf.version = version;
            fs.writeFileSync(confPath, JSON.stringify(conf, null, 2) + '\n');
          "

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck and bundle payload
        run: npm run build

      - name: Test and build app
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml
          cargo build --release --features tauri/custom-protocol --manifest-path src-tauri/Cargo.toml

      - name: Assemble zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging/runtime | Out-Null
          Copy-Item src-tauri/target/release/spotify-extension.exe staging/
          Copy-Item dist/payload/runtime.js staging/runtime/runtime.js
          Copy-Item extensions staging/extensions -Recurse
          Copy-Item themes staging/themes -Recurse
          Copy-Item snippets staging/snippets -Recurse
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path staging/* -DestinationPath release/spotify-extension-windows-x64.zip -Force

      - name: Write checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash release/spotify-extension-windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  spotify-extension-windows-x64.zip" | Out-File -Encoding ascii release/spotify-extension-windows-x64.zip.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release/spotify-extension-windows-x64.zip
            release/spotify-extension-windows-x64.zip.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Upload zip artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v7
        with:
          name: spotify-extension-windows-x64
          path: |
            release/spotify-extension-windows-x64.zip
            release/spotify-extension-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14
