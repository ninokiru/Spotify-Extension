name: build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck and bundle payload
        run: npm run build

      - name: Format check (informational)
        continue-on-error: true
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Clippy (informational)
        continue-on-error: true
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Test and build app
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml
          cargo build --release --features tauri/custom-protocol --manifest-path src-tauri/Cargo.toml

      - name: Assemble zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging/runtime | Out-Null
          Copy-Item src-tauri/target/release/spotify-extension.exe staging/
          Copy-Item dist/payload/runtime.js staging/runtime/runtime.js
          Copy-Item extensions staging/extensions -Recurse
          Copy-Item themes staging/themes -Recurse
          Copy-Item snippets staging/snippets -Recurse
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path staging/* -DestinationPath release/spotify-extension-windows-x64.zip -Force

      - name: Write checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash release/spotify-extension-windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  spotify-extension-windows-x64.zip" | Out-File -Encoding ascii release/spotify-extension-windows-x64.zip.sha256

      - name: Upload zip
        uses: actions/upload-artifact@v7
        with:
          name: spotify-extension-windows-x64
          path: |
            release/spotify-extension-windows-x64.zip
            release/spotify-extension-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload lockfile
        uses: actions/upload-artifact@v7
        with:
          name: cargo-lock
          path: src-tauri/Cargo.lock
          if-no-files-found: ignore
          retention-days: 7
