appId: com.ninokiru.spotify-extension
productName: Spotify Extension
copyright: Copyright © 2026 ninokiru

directories:
  output: release
  buildResources: build

npmRebuild: false
asar: true
compression: maximum

asarUnpack:
  - dist/payload/**
  - extensions/**
  - themes/**

files:
  - dist/**/*
  - extensions/**/*
  - themes/**/*
  - package.json

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.png
  artifactName: Spotify-Extension-Setup-${version}-x64.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Spotify Extension
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  installerLanguages:
    - en_US
    - vi_VN

publish:
  provider: github
  owner: ninokiru
  repo: Spotify-Extension
